# so credit ^ and ty <3

name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/expo/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/actions/setup-yarn/**'
      - '.github/workflows/build_android.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build (defaults to the selected workflow branch)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-yarn

      - name: Setup Java JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Add swap space for build
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 10
      # ^ https://github.com/actions/runner/issues/2468#issuecomment-1651313943

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Generate native Android project
        working-directory: apps/expo
        env:
          EXPO_NO_TELEMETRY: '1'
          STUMP_ANDROID_PACKAGE: 'com.stumpapp.stump.dev'
        run: npx expo prebuild --platform android --no-install

      # TODO: should probably add signing but not sorting that out now
      - name: Generate temporary release keystore
        working-directory: apps/expo/android
        run: |
          keytool -genkeypair -v \
            -keystore temp-release.keystore \
            -alias temp-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass stump-temp-password \
            -keypass stump-temp-password \
            -dname "CN=Stump, OU=Dev, O=Stump, L=Stump, S=Stump, C=US"

      - name: Build release APK
        working-directory: apps/expo/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --max-workers=2 \
            -Pandroid.injected.signing.store.file="$PWD/temp-release.keystore" \
            -Pandroid.injected.signing.store.password=stump-temp-password \
            -Pandroid.injected.signing.store.key.alias=temp-alias \
            -Pandroid.injected.signing.store.key.password=stump-temp-password

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stump-android-release-apk
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
