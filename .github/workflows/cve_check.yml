name: CVE Check

on:
  push:
    paths:
      - .github/workflows/cve_check.yml
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  yarn-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run yarn audit
        # 1138808 -> image-size: there is no patch available, and this dep is pulled in by
        #            metro bundler (which is build-time only and ends up in the app bundle)
        # 1138809 -> image-size: same as above
        run: ./scripts/github/yarn-audit-with-allowlist.sh 1138808 1138809
