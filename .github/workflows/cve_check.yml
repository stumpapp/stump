name: CVE Check

on:
  push:
    paths:
      - .github/workflows/cve_check.yml
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  yarn-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run yarn audit
        # 1243066 -> zod: fix requires a zod v3 -> v4 major migration, will attempt briefly
        #            in this branch but if too large diff will revisit to isolate it out
        # 1243505 -> deepmerge: no patched version avail but also only consumers are build/dev tooling
        #            (@expo/config, workbox-build, storybook) and storybook in particular is not
        #            long for this world
        # 1244012 -> minimatch: fix is 3.x to 11.x which, uh, is certainly a bump, but consumers
        #            again are only dev tooling (eslint, lerna, gitmoji-changelog, storybook) so
        #            acceptable for now
        # 1244013 -> glob: fix is in 14.x major bump, rly only dev consumers and they are pinned
        #            to diff major versions each so a big headache (expo, lerna, cacache, rimraf)
        run: ./scripts/github/yarn-audit-with-allowlist.sh 1243066 1243505 1244012 1244013
